/* @tokens:begin - inlined from ui/parts/plateau-tokens.css (source of truth; edit there, re-inline here) */
/* Plateau v3 design system: tokens, shared components, layout layer.
   Source of truth. The prototype inlines this whole file between "@tokens:begin" and "@tokens:end".
   Card-back world, softened for readability (WCAG 2.2 AA checked).
   Body text >= 13px, labels >= 12px, ink is soft charcoal, borders mostly 1px rules.
   Team colour is an ACCENT only (crest, active nav, primary button, own rows) - never a large field.
   Grade chips: each grade has its own fg/bg pair (all >= 6:1 in light, >= 7.5:1 in dark; AAA ink on foil >= 5.7:1). */
:root{
  --ground:#E6E4DE; --paper:#F7F6F2; --paper-2:#EFEDE7; --rule:#D3D0C7; --rule-strong:#8A867E;
  --ink:#2B2A30; --ink-2:#57555E; --ink-3:#65626B;
  --team:#B5381B; --on-team:#FFFFFF; --team-ink:#9E2F16; --team-tint:#F6E3DB; --team-2:#E2AE14; --on-team-2:#2B2006;
  /* event / state categories: fg is text+icon colour, bg is chip fill. Always paired with an icon + word. */
  --ev-health:#A3241B;  --ev-health-bg:#F8E1DD;   /* injured, returned, IR */
  --ev-growth:#2B6A2B;  --ev-growth-bg:#E1EFDC;   /* graded up, evolved, goal met, done */
  --ev-decline:#7E5000; --ev-decline-bg:#F7EAC8;  /* declining, expiring, slot broken */
  --ev-deal:#1F5A99;    --ev-deal-bg:#DEE9F6;     /* offer, signed, claimed, promoted */
  --ev-league:#5A3B98;  --ev-league-bg:#E9E2F5;   /* series won/lost, clinched, eliminated */
  --ev-honour:#6A5200;  --ev-honour-bg:#F2EBCB;   /* award, record, inducted, retired */
  --ev-scout:#0F655C;   --ev-scout-bg:#DAEEEB;    /* report ready, lottery, pick made */
  --gr-F:#8E1F16; --gr-F-bg:#F7DCD8; --gr-D:#8A3D05; --gr-D-bg:#F9E2CF; --gr-C:#6B4C00; --gr-C-bg:#F4E6BC;
  --gr-B:#22602A; --gr-B-bg:#DCEDD6; --gr-A:#0B5A52; --gr-A-bg:#D3ECE7; --gr-AA:#1B4E8C; --gr-AA-bg:#DAE6F6; --gr-AAA:#2B2A30;
  --spr-bg:#EDEBE4;
  --foil:linear-gradient(115deg,#d9dde3 0%,#f3e9c9 22%,#d7e9e4 44%,#e6d6ee 66%,#f1f0e6 86%,#d9dde3 100%);
  --font-display:"Rokkitt",Rockwell,"Roboto Slab",Georgia,serif;
  --font-ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  --r:4px; --r-lg:6px; --shadow:0 1px 2px rgba(30,28,34,.06),0 6px 18px -8px rgba(30,28,34,.18);
  --scrim:rgba(20,18,24,.45);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#18171B; --paper:#1E1D22; --paper-2:#26252B; --rule:#36343C; --rule-strong:#6B6872;
  --ink:#E4E1DA; --ink-2:#ADAAB2; --ink-3:#8F8C96;
  --team:#E8704F; --on-team:#1A0E09; --team-ink:#F08B6D; --team-tint:#3A231B; --team-2:#F0C23C; --on-team-2:#1A1305;
  --ev-health:#F2958C;  --ev-health-bg:#3A1F1C; --ev-growth:#8FD08A; --ev-growth-bg:#1F3220; --ev-decline:#E9BC63; --ev-decline-bg:#3A2F14;
  --ev-deal:#8DB8EE; --ev-deal-bg:#1B2A3D; --ev-league:#BDA6F0; --ev-league-bg:#2B2440; --ev-honour:#E3CC6E; --ev-honour-bg:#35301A;
  --ev-scout:#7FD3C7; --ev-scout-bg:#163330;
  --gr-F:#F7B0A8; --gr-F-bg:#4A1E1A; --gr-D:#F6BE8E; --gr-D-bg:#4A2A14; --gr-C:#EDD08A; --gr-C-bg:#42361A;
  --gr-B:#9ED89A; --gr-B-bg:#1F3A22; --gr-A:#86D9CD; --gr-A-bg:#143A36; --gr-AA:#A5C8F2; --gr-AA-bg:#1B2E4A; --gr-AAA:#141318;
  --spr-bg:#2A2930;
  --foil:linear-gradient(115deg,#8a909a 0%,#c4b37e 22%,#8ab0a8 44%,#ad97ba 66%,#c0bdb0 86%,#8a909a 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --ground:#18171B; --paper:#1E1D22; --paper-2:#26252B; --rule:#36343C; --rule-strong:#6B6872;
  --ink:#E4E1DA; --ink-2:#ADAAB2; --ink-3:#8F8C96;
  --team:#E8704F; --on-team:#1A0E09; --team-ink:#F08B6D; --team-tint:#3A231B; --team-2:#F0C23C; --on-team-2:#1A1305;
  --ev-health:#F2958C;  --ev-health-bg:#3A1F1C; --ev-growth:#8FD08A; --ev-growth-bg:#1F3220; --ev-decline:#E9BC63; --ev-decline-bg:#3A2F14;
  --ev-deal:#8DB8EE; --ev-deal-bg:#1B2A3D; --ev-league:#BDA6F0; --ev-league-bg:#2B2440; --ev-honour:#E3CC6E; --ev-honour-bg:#35301A;
  --ev-scout:#7FD3C7; --ev-scout-bg:#163330;
  --gr-F:#F7B0A8; --gr-F-bg:#4A1E1A; --gr-D:#F6BE8E; --gr-D-bg:#4A2A14; --gr-C:#EDD08A; --gr-C-bg:#42361A;
  --gr-B:#9ED89A; --gr-B-bg:#1F3A22; --gr-A:#86D9CD; --gr-A-bg:#143A36; --gr-AA:#A5C8F2; --gr-AA-bg:#1B2E4A; --gr-AAA:#141318;
  --spr-bg:#2A2930;
  --foil:linear-gradient(115deg,#8a909a 0%,#c4b37e 22%,#8ab0a8 44%,#ad97ba 66%,#c0bdb0 86%,#8a909a 100%);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6); color-scheme:dark }

/* ===== Layout layer: scales. Screens are compositions of the primitives below; screens must not invent spacing, widths or dialog rules. ===== */
:root{
  /* spacing scale: the only gaps/paddings/margins allowed */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  /* type scale */
  --t-label:12px; --t-small:13px; --t-body:14px; --t-lead:16px; --t-h3:18px; --t-h2:22px; --t-h1:28px; --t-num:18px;
  --lh-tight:1.2; --lh-body:1.45;
  /* control sizes: every button/input in a group shares one height and one min width */
  --ctl-h:36px; --ctl-h-sm:32px; --ctl-w:132px; --ctl-h-touch:44px; --tab-h:44px; --row-h:52px;
  /* layout */
  --page-max:1240px; --side-w:200px; --gutter:16px; --card-min:260px; --dialog-w:560px; --label-w:112px;
}
@media (max-width:640px){ :root{ --ctl-h:var(--ctl-h-touch); --ctl-h-sm:var(--ctl-h-touch); --t-h1:24px; --t-h2:20px } }

/* ---- base ---- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--ground)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:var(--t-body);line-height:var(--lh-body);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{margin:0;font-family:var(--font-display);color:var(--ink);line-height:var(--lh-tight)}
p{margin:0} ul,ol{list-style:none;margin:0;padding:0} dl,dd{margin:0} a{color:inherit} button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--team);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-2)} .dash{color:var(--ink-3)}

/* ---- shared components (class names are reserved; do not redefine in screens) ---- */
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cap{font-stretch:78%;font-weight:700;font-size:var(--t-label);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}  /* small caps label */
.grade{display:inline-grid;place-items:center;min-width:34px;height:24px;padding:0 6px;border-radius:3px;font-family:var(--font-display);font-weight:800;font-size:16px;line-height:1;border:1px solid currentColor}
.gF{background:var(--gr-F-bg);color:var(--gr-F)} .gD{background:var(--gr-D-bg);color:var(--gr-D)} .gC{background:var(--gr-C-bg);color:var(--gr-C)}
.gB{background:var(--gr-B-bg);color:var(--gr-B)} .gA{background:var(--gr-A-bg);color:var(--gr-A)} .gAA{background:var(--gr-AA-bg);color:var(--gr-AA)}
.gAAA{background:var(--foil);color:var(--gr-AAA);border-color:var(--rule-strong)}
/* event chip: icon + word, category colour (.c-health .c-growth .c-decline .c-deal .c-league .c-honour .c-scout). */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:3px 8px;border-radius:3px;font-size:12.5px;font-weight:650;line-height:1.2;white-space:nowrap}
.chip svg.i{width:14px;height:14px;stroke-width:2}
.c-health{color:var(--ev-health);background:var(--ev-health-bg)} .c-growth{color:var(--ev-growth);background:var(--ev-growth-bg)}
.c-decline{color:var(--ev-decline);background:var(--ev-decline-bg)} .c-deal{color:var(--ev-deal);background:var(--ev-deal-bg)}
.c-league{color:var(--ev-league);background:var(--ev-league-bg)} .c-honour{color:var(--ev-honour);background:var(--ev-honour-bg)}
.c-scout{color:var(--ev-scout);background:var(--ev-scout-bg)}
/* status tag (injury / contract designation): icon + word */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:var(--t-label);font-weight:700;height:22px;padding:0 7px 0 5px;border-radius:3px;white-space:nowrap;flex:none}
.tag svg.i{width:13px;height:13px;stroke-width:2.25}
.t-dtd,.t-exp{color:var(--ev-decline);background:var(--ev-decline-bg)} .t-out,.t-ir{color:var(--ev-health);background:var(--ev-health-bg)} .t-focus{color:var(--ev-growth);background:var(--ev-growth-bg)}
/* type chip */
.type{display:inline-flex;align-items:center;height:24px;font-size:var(--t-label);font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:0 7px;border-radius:3px;color:#fff;line-height:1;white-space:nowrap}
.ty-dragon{background:#5B32C9}.ty-ground{background:#7A5A1C}.ty-steel{background:#5A5A70}.ty-dark{background:#4B3B2E}.ty-water{background:#2F5FB8}.ty-fire{background:#B04A16}.ty-bug{background:#56620E}.ty-ghost{background:#5B4380}.ty-fairy{background:#A54A78}.ty-flying{background:#5E50B0}
.ty-electric{background:#7A5E00}.ty-fighting{background:#A1352B}.ty-poison{background:#7A3F8C}.ty-ice{background:#2A6F7A}.ty-rock{background:#6B5B16}.ty-grass{background:#2F6B22}.ty-normal{background:#6A6458}.ty-psychic{background:#A3365F}
/* buttons: .btn, .btn.go (primary), .btn.sm (row actions); aria-pressed / aria-disabled states */
.btn{font:inherit;font-weight:700;font-size:var(--t-body);line-height:1.2;border-radius:var(--r);min-height:var(--ctl-h);padding:0 14px;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink);cursor:pointer;display:inline-flex;gap:var(--s2);align-items:center;justify-content:center;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--paper-2)}
.btn.go{background:var(--team);color:var(--on-team);border-color:var(--team)}
.btn.go:hover{filter:brightness(1.06);background:var(--team)}
.btn[aria-pressed="true"]{background:var(--team-tint);color:var(--team-ink);border-color:var(--team-ink)}
.btn[aria-disabled="true"]{color:var(--ink-3);border-color:var(--rule);cursor:not-allowed;background:var(--paper)}
.btn.sm{min-height:var(--ctl-h-sm);padding:0 12px;font-size:var(--t-small)}
.x{width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;border-radius:var(--r);background:transparent;cursor:pointer;color:var(--ink-2);flex:none}  /* icon close button */
.x:hover{background:var(--paper-2)}
select{font:inherit;font-weight:650;font-size:var(--t-body);height:var(--ctl-h);padding:0 32px 0 12px;border:1px solid var(--rule-strong);border-radius:var(--r);background-color:var(--paper);color:var(--ink);appearance:none;max-width:100%;min-width:0;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
/* name link (inline) */
.name{font-weight:700;color:var(--ink);text-decoration:none;border-bottom:1.5px solid transparent}
.name:hover{border-bottom-color:var(--team)}
/* ref: icon + name of any Pokémon (own or other club). Always a .peek. Name truncates, icon never shrinks. */
.ref{display:inline-flex;align-items:center;gap:var(--s2);min-width:0;max-width:100%;min-height:32px;color:var(--ink);text-decoration:none;font-weight:700}
.ref>.nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1.5px solid transparent}
.ref:hover>.nm,a.ref:focus-visible>.nm{border-bottom-color:var(--team)}
span.ref>.nm{border-bottom:1.5px dotted var(--rule-strong)}
.ref.inline{display:inline;min-height:0}  /* name inside running text */
.ref.inline>.nm{white-space:inherit}
/* peek: hover/focus/tap explanation. The .pop child is never shown in place; one floating layer (.l-peek-layer, #float) shows it. */
.peek{position:relative;cursor:help}
a.peek,button.peek{cursor:pointer}
span.peek:not(.ref){display:inline-block}
.peek>.pop{display:none !important}
.info{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule-strong);background:var(--paper);color:var(--ink-2);font-family:var(--font-display);font-weight:800;font-size:14px;font-style:normal;line-height:1;cursor:help;vertical-align:middle;padding:0;text-transform:none;letter-spacing:0;flex:none}  /* (i) peek trigger */
.info:hover{background:var(--paper-2);color:var(--ink)}
.fitbar{height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}  /* thin meter */
.fitbar i{display:block;height:100%;background:var(--ink-2)}
.cnt{min-width:22px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;font-size:var(--t-label);font-weight:700;background:var(--ev-health-bg);color:var(--ev-health)}  /* count badge; .off keeps its space */
.cnt.off{visibility:hidden}
/* role badge: full role name | OVR */
.rb{display:inline-flex;align-items:stretch;height:28px;border:1px solid var(--rule-strong);border-radius:3px;overflow:hidden;vertical-align:middle;line-height:1;white-space:nowrap;max-width:100%}
.rb-r{display:flex;align-items:center;padding:0 var(--s2);background:var(--paper-2);color:var(--ink-2);font-stretch:85%;font-weight:700;font-size:var(--t-small);border-right:1px solid var(--rule-strong);min-width:0;overflow:hidden;text-overflow:ellipsis}
.rb-n{display:grid;place-items:center;min-width:36px;padding:0 6px;background:var(--paper);color:var(--ink);font-family:var(--font-display);font-weight:800;font-size:var(--t-num);flex:none}
.rb.elite .rb-n{color:var(--team-ink)}
.rb.lg{height:32px}.rb.lg .rb-n{font-size:22px;min-width:44px}
.peek .rb-n span{text-decoration:underline dotted 1.5px;text-decoration-color:var(--ink-3);text-underline-offset:3px}
.noset{display:inline-flex;align-items:center;height:28px;padding:0 8px;border:1px dashed var(--rule-strong);border-radius:3px;font-size:var(--t-small);font-weight:650;color:var(--ink-2);white-space:nowrap}
/* switch: role="switch" aria-checked; label sits beside it, text never changes */
.switch{position:relative;width:44px;height:26px;border-radius:13px;border:1px solid var(--rule-strong);background:var(--paper-2);cursor:pointer;padding:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--ink-2);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--team);border-color:var(--team)}
.switch[aria-checked="true"]::after{transform:translateX(18px);background:var(--on-team)}
/* sprites */
.ico{display:inline-block;width:40px;height:30px;flex:none;overflow:hidden;position:relative}
.ico img{display:block;width:40px;height:30px;image-rendering:pixelated}
.ico img.fb{width:40px;height:40px;margin-top:-6px}
.spr{display:grid;place-items:center;flex:none;width:72px;height:72px;border-radius:var(--r-lg);background:var(--spr-bg);border:1px solid var(--rule);overflow:hidden}
.spr img{width:72px;height:72px;image-rendering:pixelated;display:block}
.spr.xl{width:112px;height:112px}.spr.xl img{width:96px;height:96px}
.spr.md{width:56px;height:56px}.spr.md img{width:56px;height:56px}

/* ===== Layout layer: primitives ===== */
/* app shell: sidebar of rooms + main column; on phone the sidebar becomes .l-tabbar */
.l-shell{max-width:var(--page-max);margin-inline:auto;padding:var(--s4) var(--gutter);display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);gap:var(--s6);align-items:start}
.l-shell>*{min-width:0}
/* sidebar: club + room links */
.l-side{position:sticky;top:var(--s4);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--s4) var(--s3);display:grid;gap:var(--s4);align-content:start;min-height:calc(100vh - 2*var(--s4))}
.l-side nav{display:grid;gap:var(--s1)}
.l-side nav a{display:flex;align-items:center;gap:var(--s3);min-height:var(--ctl-h);padding:0 var(--s3);border-radius:var(--r);color:var(--ink-2);text-decoration:none;font-weight:650}
.l-side nav a:hover{background:var(--paper-2);color:var(--ink)}
.l-side nav a[aria-current="page"]{background:var(--team-tint);color:var(--team-ink)}
.l-side nav a .cnt{margin-left:auto}
/* phone tab bar: max 5 items, fixed to the bottom */
.l-tabbar{display:none}
/* page: vertical stack of sub-tabs, head, sections. Same rhythm on every page */
.l-page{display:grid;gap:var(--s5);grid-template-columns:minmax(0,1fr);min-width:0;padding-bottom:var(--s7)}
.l-page>*{min-width:0}
/* page head: title (+ one sub line) left, .l-actions right; fixed min height so pages line up */
.l-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:var(--s2) var(--s5);min-height:64px}
.l-head>div{display:grid;gap:var(--s2);min-width:0}
.l-head h1{font-size:var(--t-h1);font-weight:800;line-height:var(--lh-tight)}
.l-head h1:focus{outline:none}
.l-head .sub{color:var(--ink-2)}
/* section: title -> content is always --s3 */
.l-section{display:grid;gap:var(--s3);align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)}
.l-section>*{min-width:0}
.l-section>h2,.l-section>.l-split>h2{font-size:var(--t-h2);font-weight:700;line-height:var(--lh-tight)}
/* panel: boxed section (use with .l-section). .flush = no padding, children handle their own (tables, tabs) */
.l-panel{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--s5);min-width:0}
.l-panel.flush{padding:0;overflow:hidden}
.l-panel.flush>h2,.l-panel.flush>.l-pad{padding:var(--s5) var(--s5) 0}
/* two-column body: 7/5 split, collapses to one column. .side-first: 2nd child spans the right column, so on phone it comes 2nd */
.l-cols{display:grid;gap:var(--s5);grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}
.l-cols>*{min-width:0}
.l-cols.side-first{grid-auto-flow:row dense}
.l-cols.side-first>:nth-child(2){grid-column:2;grid-row:1/span 2}
.l-cols.side-first>:not(:nth-child(2)){grid-column:1}
/* stacks and rows */
.l-stack{display:grid;gap:var(--s3);align-content:start;min-width:0;grid-template-columns:minmax(0,1fr)} .l-stack>*{min-width:0} .l-stack.tight{gap:var(--s2)} .l-stack.loose{gap:var(--s5)}
.l-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2);min-width:0}          /* inline things share one centre line */
.l-split{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s3);min-width:0}
/* equal-size cards; set --card-min on the grid to change the column minimum */
.l-grid{display:grid;gap:var(--s4);grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card-min)),1fr));grid-auto-rows:1fr}
.l-grid>*{min-width:0}
/* wrap list of small refs (icon + name); never overflows */
.l-wrap{display:grid;gap:var(--s1) var(--s3);grid-template-columns:repeat(auto-fill,minmax(min(100%,136px),1fr))}
.l-wrap>*{min-width:0}
/* equal-width buttons; on phone they share the row equally */
.l-actions{display:grid;gap:var(--s2);grid-auto-flow:column;grid-auto-columns:minmax(var(--ctl-w),1fr);justify-content:start}
.l-actions>.btn{min-height:var(--ctl-h)}
/* list rows: --cols sets the grid, every row text-baseline aligned so chips, text and buttons line up */
.l-list>li{display:grid;grid-template-columns:var(--cols,minmax(0,1fr) auto);gap:var(--s3);align-items:baseline;padding:var(--s3) 0;border-top:1px solid var(--rule);min-height:var(--row-h)}
.l-list>li>*{min-width:0}
/* label/value pairs; label column is --label-w */
.l-kv{display:grid;grid-template-columns:var(--label-w) minmax(0,1fr);gap:var(--s3) var(--s4);align-items:center}
.l-kv>dt,.l-kv>.k{color:var(--ink-2)}
.l-kv>dd,.l-kv>.v{min-width:0}
/* labelled facts stacked: .cap label above value */
.l-facts{display:grid;gap:var(--s4)}
.l-facts>div{display:grid;gap:var(--s2);min-width:0}
/* sub-tabs: links, same position on every page of a room; weight never changes so nothing jumps */
.l-tabs{display:flex;gap:var(--s5);border-bottom:1px solid var(--rule);overflow-x:auto;scrollbar-width:none;min-width:0}
.l-tabs::-webkit-scrollbar{display:none}
.l-tabs>a,.l-tabs>button,.l-tabs>span>a{position:relative;display:inline-flex;align-items:center;gap:var(--s2);min-height:var(--tab-h);padding:0;border:0;background:none;font-weight:700;font-size:var(--t-body);color:var(--ink-2);text-decoration:none;white-space:nowrap;cursor:pointer;flex:none}
.l-tabs>span{display:contents}
.l-tabs a:hover,.l-tabs button:hover{color:var(--ink)}
.l-tabs [aria-current="page"],.l-tabs [aria-selected="true"]{color:var(--ink)}
.l-tabs [aria-current="page"]::after,.l-tabs [aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px 2px 0 0;background:var(--team)}
.l-tabs :focus-visible{outline-offset:-3px}
.l-panel>.l-tabs{padding:0 var(--s5)}
/* tables: fixed columns from one <colgroup>, scroll inside own box, headers never move between lenses */
.l-table-wrap{overflow-x:auto;min-width:0;position:relative} /* positioned so .sr text in cells can't escape the scroll box */
.l-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--t-body)}
.l-table th,.l-table td{height:var(--row-h);padding:0 var(--s3);text-align:left;vertical-align:middle;border-bottom:1px solid var(--rule);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l-table th:first-child,.l-table td:first-child{padding-left:var(--s5)}
.l-table th:last-child,.l-table td:last-child{padding-right:var(--s5)}
.l-table thead th{height:44px;font-stretch:78%;font-size:var(--t-label);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);border-bottom-color:var(--rule-strong)}
.l-table .num{text-align:right}
.l-table tbody th.grp{height:40px;font-family:var(--font-display);font-size:var(--t-h3);font-weight:700;color:var(--ink);background:var(--paper-2)}
.l-table tbody th.grp span{font-family:var(--font-ui);font-size:var(--t-small);font-weight:500;color:var(--ink-2);margin-left:var(--s2)}
.l-table tr.cur td{background:var(--team-tint)}
.l-table tr.cur td:first-child{box-shadow:inset 3px 0 0 var(--team)}
.l-table tr.off td{background-image:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--rule) 60%,transparent) 7px 8px)}  /* unavailable row */
.l-table tr.tot td{border-top:3px double var(--rule-strong);border-bottom:0;font-weight:800}
/* card */
.l-card{background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-lg);padding:var(--s4);display:grid;gap:var(--s3);align-content:start;min-width:0}
/* empty / placeholder block */
.l-empty{display:grid;gap:var(--s2);justify-items:start;padding:var(--s4);border:1px dashed var(--rule-strong);border-radius:var(--r-lg);background:var(--paper-2);color:var(--ink-2)}
.l-empty b{color:var(--ink)}
/* reserved space for dynamic text so nothing shifts; set --lines */
.l-reserve{min-height:calc(var(--t-body) * var(--lh-body) * var(--lines,1))}
/* clamp text to --lines lines, height reserved */
.l-clamp{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:var(--lines,2);overflow:hidden;min-height:calc(1em * var(--lh-body) * var(--lines,2))}
/* dialog: always centred and inside the viewport; head / scrolling body / foot */
dialog.l-dialog{position:fixed;inset:0;margin:auto;width:min(var(--dialog-w),calc(100% - 2*var(--gutter)));max-width:none;max-height:min(760px,calc(100% - 2*var(--gutter)));height:fit-content;padding:0;border:1px solid var(--rule-strong);border-radius:var(--r-lg);background:var(--paper);color:var(--ink);box-shadow:var(--shadow);overflow:hidden}
dialog.l-dialog[open]{display:flex;flex-direction:column}
dialog.l-dialog::backdrop{background:var(--scrim)}
.l-dialog-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--rule);flex:none}
.l-dialog-head h2{font-size:var(--t-h2);font-weight:800}
.l-dialog-head .x{margin-left:auto}
.l-dialog-body{padding:var(--s5);display:grid;gap:var(--s4);overflow:auto;min-height:0;flex:1 1 auto}
.l-dialog-foot{display:flex;justify-content:flex-end;padding:var(--s3) var(--s5) var(--s4);border-top:1px solid var(--rule);flex:none}
/* floating peek layer (#float): one per page, positioned by script inside the viewport */
.l-peek-layer{position:fixed;z-index:60;width:min(300px,calc(100vw - 2*var(--gutter)));background:var(--paper);color:var(--ink);border:1px solid var(--rule-strong);border-radius:var(--r);box-shadow:var(--shadow);padding:var(--s3);font-size:13.5px;line-height:var(--lh-body);display:grid;gap:var(--s2);pointer-events:none}
.l-peek-layer[hidden]{display:none}
.l-peek-layer .row{display:flex;justify-content:space-between;gap:var(--s3)}
.l-peek-layer .row>span:first-child{color:var(--ink-2)}
.l-peek-layer .row b{font-family:var(--font-display);font-size:17px}
.l-peek-layer .tot{border-top:1px solid var(--rule);padding-top:var(--s2)}
.l-peek-layer .types{display:flex;gap:var(--s1)}

/* ---- responsive behaviour of the primitives ---- */
@media (max-width:1060px){ .l-cols{grid-template-columns:minmax(0,1fr)} .l-cols.side-first>*{grid-column:auto !important;grid-row:auto !important} }
@media (max-width:759px){
  .l-shell{grid-template-columns:minmax(0,1fr);gap:0;padding-top:0}
  .l-side{display:none}
  .l-page{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  .l-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--paper);border-top:1px solid var(--rule);padding:var(--s1) max(var(--s2),env(safe-area-inset-right)) calc(var(--s1) + env(safe-area-inset-bottom)) max(var(--s2),env(safe-area-inset-left))}
  .l-tabbar a{flex:1 1 0;min-width:0;display:grid;justify-items:center;align-content:center;gap:2px;min-height:52px;text-decoration:none;color:var(--ink-2);font-size:var(--t-label);font-weight:650;border-radius:var(--r);position:relative;white-space:nowrap}
  .l-tabbar a svg.i{width:20px;height:20px}
  .l-tabbar a[aria-current="page"]{color:var(--team-ink)}
  .l-tabbar a[aria-current="page"]::before{content:"";position:absolute;top:-5px;left:28%;right:28%;height:3px;border-radius:0 0 2px 2px;background:var(--team)}
  .l-panel{padding:var(--s4)}
  .l-panel.flush>h2,.l-panel.flush>.l-pad{padding:var(--s4) var(--s4) 0}
  .l-panel>.l-tabs{padding:0 var(--s4)}
  .l-table th:first-child,.l-table td:first-child{padding-left:var(--s4)}
  .l-table th:last-child,.l-table td:last-child{padding-right:var(--s4)}
}
@media (max-width:640px){
  .l-head{grid-template-columns:minmax(0,1fr);min-height:0}
  .l-actions{grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);justify-content:stretch}
  .l-kv{grid-template-columns:minmax(0,1fr);row-gap:var(--s1)}
  .l-kv>dd,.l-kv>.v{margin-bottom:var(--s2)}
  .l-list.wrap>li{grid-template-columns:minmax(0,1fr) auto}
  .l-list.wrap>li>:first-child{grid-column:1;grid-row:1;justify-self:start}
  .l-list.wrap>li>:last-child{grid-column:2;grid-row:1}
  .l-list.wrap>li>:nth-child(2):not(:last-child){grid-column:1/-1;grid-row:2}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* ---- additions ---- */
.l-row.even>*{height:28px}  /* inline chips/badges/tags in one row share one height and centre line */
.l-row.even>.type,.l-row.even>.tag{padding-inline:var(--s2)}

/* card title: the first-read heading inside .l-card */
.l-card-title{font-family:var(--font-display);font-size:var(--t-h3);font-weight:700;line-height:var(--lh-tight);margin:0}
/* peek label: dotted underline that says "hover or tap for more" */
.peek>.lbl,.l-peek-lbl{text-decoration:underline dotted 1.5px;text-decoration-color:var(--ink-3);text-underline-offset:4px}

/* @tokens:end */

/* ================= screen compositions (only scale values; layout comes from .l- primitives) ================= */
/* shell bits */
.club{display:grid;grid-template-columns:40px minmax(0,1fr);gap:var(--s3);align-items:center;padding:0 var(--s2) var(--s4);border-bottom:1px solid var(--rule)}
.crest{width:40px;height:40px;border-radius:50%;background:var(--team);color:var(--on-team);display:grid;place-items:center;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--team);flex:none}
.crest svg{width:22px;height:22px;fill:var(--team-2);stroke:none}
.club b{display:block;font-family:var(--font-display);font-weight:800;font-size:var(--t-h3);line-height:var(--lh-tight)}
.club span{font-size:var(--t-small);color:var(--ink-2)}
.nextup{border-top:1px solid var(--rule);padding:var(--s4) var(--s2) 0;display:grid;gap:var(--s1);font-size:var(--t-small);color:var(--ink-2)}
.nextup b{color:var(--ink)}
.mhead{display:none}
@media (max-width:759px){
  .mhead{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) 0}
  .mhead .crest{width:32px;height:32px}.mhead .crest svg{width:18px;height:18px}
  .mhead b{font-family:var(--font-display);font-weight:800;font-size:var(--t-lead)}
  .mhead .rec{margin-left:auto;font-size:var(--t-small);color:var(--ink-2)}
}
/* sub-nav: the other room's tabs show only on phone (League + Draft share one phone tab) */
.subnav .alt{display:none}
.subnav .sep{width:1px;align-self:center;height:20px;background:var(--rule-strong);flex:none}
@media (max-width:759px){ .subnav .alt{display:contents} }

/* ===== This week ===== */
.ev{--cols:112px minmax(0,1fr) var(--ctl-w)}
.ev .btn,.ev .done{width:var(--ctl-w)}
.done{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--ctl-h-sm);border-radius:var(--r);font-size:var(--t-small);font-weight:700;color:var(--ev-growth);background:var(--ev-growth-bg)}
.ev li.resolved p{color:var(--ink-2)}
.feed{--cols:112px minmax(0,1fr) 48px}
.feed p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .when{font-size:var(--t-small);color:var(--ink-3);text-align:right}
@media (max-width:640px){ .ev .btn,.ev .done{width:auto;min-width:var(--ctl-w)} .feed p{white-space:normal} }
.opp-h{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);align-items:center}
.opp-h h2{font-size:var(--t-h2);font-weight:800}
.pips{display:flex;gap:var(--s2)}
.pips i{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-strong);display:grid;place-items:center;font-style:normal;font-family:var(--font-display);font-weight:700;font-size:var(--t-small);color:var(--ink-3)}
.pips i.w{background:var(--ev-growth-bg);color:var(--ev-growth);border-color:currentColor}
.pips i.l{background:var(--ev-health-bg);color:var(--ev-health);border-color:currentColor}
/* result dialog content */
.score{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:var(--s3);text-align:center;font-weight:700}
.score b{font-family:var(--font-display);font-size:40px;font-weight:800;line-height:1}
.games{--cols:64px 96px minmax(0,1fr)}
@media (max-width:480px){ .games{--cols:minmax(0,1fr) auto} .games li>:first-child{display:none} .games li>:last-child{grid-column:1/-1} }
.mvp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s3);align-items:center;padding:var(--s3);border:1px solid var(--rule);border-radius:var(--r-lg);background:var(--paper-2)}
.mvp b{font-family:var(--font-display);font-size:var(--t-h2);display:block}

/* ===== Roster ===== */
.roster{min-width:760px}
.who{display:flex;align-items:center;gap:var(--s2);min-width:0}
.lensbar{display:flex;align-items:center;gap:var(--s3);height:56px;padding:0 var(--s5);border-bottom:1px solid var(--rule);color:var(--ink-2);overflow:hidden;white-space:nowrap}
.lensbar>span{overflow:hidden;text-overflow:ellipsis}
.gbar{display:grid;grid-template-columns:minmax(48px,1fr) 80px;gap:var(--s2);align-items:center}
.gbar .fitbar{position:relative;overflow:visible}
.gbar .fitbar b{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);border-radius:1px}
.gbar small{font-size:var(--t-small);color:var(--ink-2)}
/* cap meter (Roster contract lens, Moves pages) */
.capm{display:flex;align-items:center;gap:var(--s3);min-width:0;white-space:nowrap}
.capm b{font-family:var(--font-display);font-size:var(--t-h3);color:var(--ink)}
.capm .fitbar{width:120px;flex:none}
@media (max-width:759px){ .lensbar{padding:0 var(--s4)} .capm .fitbar{width:64px} }

/* ===== Lineup ===== */
.lbar{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--rule)}
.lbar label{font-weight:650;color:var(--ink-2)}
.lbar .avg{color:var(--ink-2);white-space:nowrap}
.lbar .avg b{font-family:var(--font-display);font-size:var(--t-h3);color:var(--ink);display:inline-block;min-width:3ch}
.lbar .btn{margin-left:auto;min-width:var(--ctl-w)}
#strat{width:220px}
.slots{--card-min:280px;padding:var(--s5)}
.slot{grid-template-rows:auto auto auto 1fr auto}
.slot.flagged{border-color:var(--ev-decline);box-shadow:inset 0 0 0 1px var(--ev-decline)}
.slot.hl{animation:hl 2.4s ease-out 1}
@keyframes hl{0%,35%{outline:2px solid var(--team);outline-offset:3px}100%{outline:2px solid transparent;outline-offset:3px}}
.slot-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:start}
.slot-h h3{font-size:var(--t-h2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-h p{font-size:var(--t-small);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-mon{display:grid;grid-template-columns:64px minmax(0,1fr);gap:var(--s3);align-items:center}
.slot-mon .spr{width:64px;height:64px}.slot-mon .spr img{width:64px;height:64px}
.slot-mon .ref{font-size:var(--t-lead)}
.slot-set{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s2) var(--s3);align-items:center}
.slot-set label{font-weight:700;font-size:var(--t-small);color:var(--ink-2)}
.slot-set select{width:100%;font-size:var(--t-small)}
.slot-set .fills{grid-column:2;font-size:var(--t-small);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-set .fills b{color:var(--ink)}
.bk{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s2);align-items:center;min-height:var(--ctl-h);padding:0 var(--s1);border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);cursor:pointer;text-align:left}
.bk:hover{background:var(--paper-2);border-color:var(--rule-strong)}
.bk .bn{font-weight:700;font-size:var(--t-small);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk .rb{height:24px}.bk .rb-r{font-size:var(--t-label)}.bk .rb-n{font-size:var(--t-lead);min-width:30px}
.bk-none{display:flex;align-items:center;min-height:var(--ctl-h);padding:0 var(--s3);border:1px dashed var(--rule);border-radius:var(--r);font-size:var(--t-small);color:var(--ink-3)}
.slot-foot{display:flex;align-items:center;gap:var(--s2);min-height:var(--ctl-h-sm);font-size:var(--t-small);color:var(--ink-2);border-top:1px solid var(--rule);padding-top:var(--s2);min-width:0}
.slot-foot .si{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-foot .btn{margin-left:auto}
.slot-empty{grid-row:2/5;align-content:center;justify-items:center;text-align:center}
@media (max-width:759px){ .slots{padding:var(--s4)} .lbar{padding:var(--s4)} #strat{flex:1;width:auto} .lbar .btn{margin-left:0} }
/* chooser (anchored popover; bottom sheet on phone) */
#chooser{position:fixed;z-index:70;width:360px;max-width:calc(100vw - 2*var(--gutter));max-height:min(460px,70vh);display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--rule-strong);border-radius:var(--r-lg);box-shadow:var(--shadow)}
#chooser[hidden]{display:none}
#chooser .ch-h{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s3) var(--s3) var(--s4);border-bottom:1px solid var(--rule)}
#chooser .ch-h b{font-family:var(--font-display);font-size:var(--t-h3);display:block;line-height:var(--lh-tight)}
#chooser .ch-h small{font-size:var(--t-small);color:var(--ink-2)}
#chooser .ch-h .x{margin-left:auto}
#chooser ul{overflow:auto;padding:var(--s1)}
#chooser li button{width:100%;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);align-items:center;min-height:48px;padding:var(--s1) var(--s3) var(--s1) var(--s1);border:0;border-radius:var(--r);background:transparent;text-align:left;cursor:pointer}
#chooser li button:hover:not([aria-disabled="true"]),#chooser li button:focus-visible{background:var(--paper-2)}
#chooser li button[aria-current="true"]{background:var(--team-tint)}
#chooser li button[aria-disabled="true"]{cursor:not-allowed;color:var(--ink-3)}
#chooser .nm{font-weight:700;display:block;line-height:var(--lh-tight)}
#chooser .where{display:block;font-size:var(--t-small);color:var(--ink-2)}
#scrim{position:fixed;inset:0;z-index:65;background:var(--scrim)}
#scrim[hidden]{display:none}
@media (max-width:759px){ #chooser{left:0 !important;right:0;top:auto !important;bottom:0;width:auto;max-width:none;max-height:72vh;border-radius:var(--r-lg) var(--r-lg) 0 0;padding-bottom:env(safe-area-inset-bottom)} }

/* ===== Pokémon page ===== */
.back{display:inline-flex;align-items:center;gap:var(--s1);min-height:var(--ctl-h-sm);color:var(--ink-2);text-decoration:none;font-weight:650;font-size:var(--t-small);justify-self:start}
.back:hover{color:var(--ink)}
.mh{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--s5);align-items:center}
.mh h1{font-size:36px;font-weight:800}
.mh h1:focus{outline:none}
@media (max-width:640px){ .mh{gap:var(--s4)} .mh .spr.xl{width:80px;height:80px}.mh .spr.xl img{width:72px;height:72px} .mh h1{font-size:var(--t-h1)} }
.ladder{display:flex;gap:var(--s2);flex-wrap:wrap}
.ladder .step{display:grid;justify-items:center;gap:var(--s1)}
.ladder .grade{min-width:40px;height:30px}
.ladder .step.cur .grade{outline:2px solid var(--team);outline-offset:2px}
.ladder small{font-size:var(--t-label);font-weight:700;color:var(--team-ink);height:16px}
@media (max-width:540px){ .ladder{gap:var(--s1)} .ladder .grade{min-width:0;padding:0 5px;font-size:14px} }
.track{position:relative;height:10px;border-radius:5px;background:var(--paper-2);border:1px solid var(--rule)}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink-2)}
.track b{position:absolute;top:-5px;width:2px;height:18px;background:var(--ink);border-radius:1px}
.grow-top{display:flex;justify-content:space-between;align-items:baseline}
.grow-top b{font-family:var(--font-display);font-size:26px;font-weight:800}
.grow-top b small{font-size:var(--t-lead);color:var(--ink-2)}
.grow-foot{display:flex;justify-content:space-between;gap:var(--s3);font-size:var(--t-small);color:var(--ink-2)}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}

  o=o||{};const pop=`<span class="pop"><strong>${esc(o.title||name)}</strong>${o.types?`<span class="types">${typesOf(o.types)}</span>`:""}${(o.rows||[]).map(r=>prow(r[0],r[1])).join("")}${o.note?`<span>${o.note}</span>`:""}</span>`;
  const inner=`${o.icon?icoN(name):""}<span class="nm">${esc(name)}</span>${pop}`;
  return o.href?`<a class="ref peek${o.cls?" "+o.cls:""}" href="${o.href}">${inner}</a>`:`<span class="ref peek${o.cls?" "+o.cls:""}" tabindex="0">${inner}</span>`;
}
/* own Pokémon: icon+name link with peek */
function monRef(m,o){
  o=o||{};const {R}=currentRate(m),g=gradeOf(m);
  const rows=[["Role",R?`${R.role} · ${R.o}`:"No Smogon set"],["Grade",`${g[0]} · growth ${m.gr}`],["Age",`${m.age} · ${stage(m.age)}`],["Contract",`${money(m.sal)} · ${m.yrs} ${m.yrs===1?"yr":"yrs"}`]];
  if(m.inj)rows.push(["Status",m.inj.txt]);
  return pkRef(m.n,{href:"#mon-"+m.id,icon:o.icon!==false,types:m.t,rows,cls:o.cls});
}
const nameLink=m=>monRef(m,{icon:false,cls:"inline"});
/* other club's Pokémon by name (scouted) */
function oppRef(n,o){
  o=o||{};const x=OPP.mons[n]||{t:[],role:"Unknown",ovr:"—",moves:[]};
  return pkRef(n,{icon:o.icon!==false,types:x.t,title:`${n} · ${OPP.short}`,rows:[["Role (scouted)",`${x.role} · ${x.ovr}`],["Moves",x.moves.join(", ")]],note:o.note});
}
function injTag(m){if(!m.inj)return "";const k=m.inj.k,cls=k==="dtd"?"t-dtd":k==="ir"?"t-ir":"t-out",i=k==="dtd"?"pulse":"health";return `<span class="tag ${cls}">${ic(i)}${m.inj.txt}</span>`}
const focusTag=m=>S.focus.has(m.id)?`<span class="tag t-focus">${ic("target")}Focus</span>`:"";
const info=(label,popHtml)=>`<button type="button" class="info peek" aria-label="${esc(label)}">i<span class="pop">${popHtml}</span></button>`;
function ratePop(R){
  return `<span class="pop"><strong>${R.role} · ${R.o}</strong>
  ${prow(`${R.role} in ${R.tier}`,sgn(R.base))}${prow(`Grade ${R.g}`,sgn(R.ga))}
  ${prow(`IVs (${R.iv.list.map(x=>x[0]+" "+x[1]).join(", ")||"none invested"})`,sgn(R.iv.adj))}
  ${R.raw>99?prow("Capped at 99",sgn(99-R.raw)):""}
  <span class="row tot"><span>${R.tier} · ${esc(R.set.name)}</span><b>${R.o}</b></span></span>`;
}
/* role badge: full role name | OVR. opts.plain = no peek, opts.lg = large */
function badge(R,opts){
  opts=opts||{};if(!R)return `<span class="noset">No Smogon set</span>`;
  const cls="rb"+(R.o>=90?" elite":"")+(opts.lg?" lg":"");
  if(opts.num)return `<span class="peek" tabindex="0" aria-label="${esc(formula(R))}"><span class="${cls}"><span class="rb-n"><span>${R.o}</span></span></span>${ratePop(R)}</span>`;
  if(opts.plain)return `<span class="${cls}" aria-label="${R.role} ${R.o}"><span class="rb-r" aria-hidden="true">${R.role}</span><span class="rb-n" aria-hidden="true">${R.o}</span></span>`;
  return `<span class="peek" tabindex="0" aria-label="${esc(formula(R))}"><span class="${cls}"><span class="rb-r">${R.role}</span><span class="rb-n"><span>${R.o}</span></span></span>${ratePop(R)}</span>`;
}
/* scouted badge for another club's Pokémon */
const oppBadge=(role,ovr)=>`<span class="rb" aria-label="${role} ${ovr}, scouted"><span class="rb-r" aria-hidden="true">${role}</span><span class="rb-n" aria-hidden="true">${ovr}</span></span>`;
function gradePeek(m){
  const g=gradeOf(m),n=nextGrade(m);
  return `<span class="peek" tabindex="0" aria-label="Grade ${g[0]}: ${g[2]}% of set EVs, ${sgn(EV_ADJ[g[0]])} to ratings">${gchip(g[0])}<span class="pop"><strong>Grade ${g[0]}: ${g[2]}% of the set's EVs</strong>${prow("Rating adjustment",sgn(EV_ADJ[g[0]]))}${prow("Growth",m.gr+"/100")}${prow("Next grade",n?n[0]+" at "+n[1]:"Top grade")}</span></span>`;
}
/* page head: h1 + sub line + equal-width actions */
function head(title,sub,act){return `<header class="l-head"><div><h1 tabindex="-1">${title}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div>${act?`<div class="l-actions">${act}</div>`:""}</header>`}
/* cap meter: used on Roster's Contract lens and Moves pages */
function capMeter(extra){return `<span class="capm"><span>Cap room</span><b>${money(CAP-USED)}</b><span class="fitbar" role="img" aria-label="${money(USED)} of $${CAP}M used"><i style="width:${(USED/CAP*100).toFixed(1)}%"></i></span><span>${money(USED)} of $${CAP}M${extra?" · "+extra:""}</span></span>`}

/* ---------- threat model for "Watch out for" ---------- */
function watchOut(){
  const L=lineup().map(s=>s.id?{m:BY[s.id],set:setsOf(BY[s.id])[s.si]}:null).filter(Boolean);
  let best=null;
  OPP.team.forEach(n=>{const o=OPP.mons[n];if(!o)return;
    const hits=L.map(x=>({m:x.m,mv:x.set.moves.find(mv=>o.weak[MOVE_TYPE[mv]])})).filter(x=>x.mv);
    const blank=L.map(x=>({m:x.m,mv:x.set.moves.find(mv=>o.immune.includes(MOVE_TYPE[mv]))})).filter(x=>x.mv);
    const score=hits.length-(blank.length?0.5:0);
    if(!best||score<best.score)best={o,hits,blank,score};
  });
  if(!best)return null;
  const {o,hits,blank}=best,weak=Object.keys(o.weak);
  const why=(hits.length?`Only ${hits.map(h=>`${h.m.n} (${h.mv})`).join(" and ")} ${hits.length===1?"hits":"hit"} it super-effectively.`:`None of your starters hits it super-effectively.`)+
    (blank.length?` It is immune to ${[...new Set(blank.map(b=>MOVE_TYPE[b.mv]))].join(" and ")}, so ${blank.map(b=>`${b.m.n}'s ${b.mv}`).join(" and ")} ${blank.length===1?"does":"do"} nothing.`:"");
  return {o,hits,blank,weak,why,short:`${hits.length} of ${L.length} starters hit it super-effectively`};
}

/* ---------- Lineup ---------- */
function emptyText(roles){
  const hurt=MONS.filter(m=>!available(m)&&roles.some(r=>rolesOf(m).includes(r)));
  if(hurt.length)return `Only <b>${hurt.map(m=>m.n).join(", ")}</b> fills ${roles[0]}, and is ${hurt[0].inj.txt.toLowerCase()==="ir"?"on IR":hurt[0].inj.txt.toLowerCase()}.`;
  return `No one on your roster fills <b>${roles.join(" or ")}</b>.`;
}
function viewLineup(){
  const A=STRATS[S.strat],L=lineup();
  const rs=L.map((s,i)=>slotRate(i)).filter(Boolean),teamOvr=rs.length?Math.round(rs.reduce((t,r)=>t+r.o,0)/rs.length):0;
  const cards=A.slots.map((roles,i)=>{
    const s=L[i],full=roles.join(" or ");
    const flagged=S.strat==="bulky"&&i===FLAG_SLOT&&S.flag;
    const top=`<div class="slot-h"><div><h3 id="sh-${i}">${roles[0]}</h3><p>${roles.length>1?"or "+roles.slice(1).join(" or "):ROLE_DESC[roles[0]]||""}</p></div><button class="btn sm" type="button" data-chg="${i}" aria-label="Change ${full} starter${s.id?", now "+BY[s.id].n:""}">Change</button></div>`;
    if(!s.id)return `<article class="l-card slot${S.hl===i?" hl":""}" id="slot-${i}" aria-labelledby="sh-${i}">${top}
      <div class="l-empty slot-empty">${ic("empty")}<p>${emptyText(roles)}</p><a class="btn sm" href="#freeagents">Free agents</a></div>
      <div class="slot-foot"><span class="si">Empty · team plays a Pokémon down</span></div></article>`;
    const m=BY[s.id],R=slotRate(i),set=setsOf(m)[s.si];
    const bk=backups(i);
    const bkHtml=[0,1].map(k=>{const b=bk[k];return b?`<button class="bk" type="button" data-swap="${i}:${b.m.id}" aria-label="Swap in ${b.m.n}, ${b.role} ${b.o}">${ico(b.m)}<span class="bn">${b.m.n}</span>${badge(b,{plain:true})}</button>`:`<span class="bk-none">${k===0?"No other "+roles[0].toLowerCase():"—"}</span>`}).join("");
    const foot=flagged?`<span class="chip c-decline">${ic("alert")}Auto-filled · ${BY[FLAG_OUT].n} out</span><button class="btn sm" type="button" id="keepBtn">Keep</button>`
      :`<span class="si">${esc(set.item)} · ${esc(set.ability)} · ${esc(set.nature)}</span>`;
    const opts=setsOf(m).map((st,si)=>{const fits=roleIn(st,roles);return `<option value="${si}"${si===s.si?" selected":""}${fits?"":" disabled"}>${st.tier} · ${esc(st.name)}${fits?"":` (fills ${st.roles.join(", ")||"no role"})`}</option>`}).join("");
    const fills=set.roles.length?set.roles.map(r=>R&&r===R.role?`<b>${r}</b>`:r).join(", "):"no roles";
    return `<article class="l-card slot${flagged?" flagged":""}${S.hl===i?" hl":""}" id="slot-${i}" aria-labelledby="sh-${i}">${top}
      <div class="slot-mon">${sprN(m.n)}<div class="l-stack tight">${monRef(m,{icon:false})}${badge(R)}</div></div>
      <div class="slot-set"><label for="set-${i}">Set</label><select id="set-${i}" data-slotset="${i}">${opts}</select><p class="fills" id="fills-${i}">This set: ${fills}</p></div>
      <div class="l-stack tight"><span class="cap">Backups</span>${bkHtml}</div>
      <div class="slot-foot">${foot}</div>
    </article>`;
  }).join("");
  return head("Lineup",`Week ${CLUB.week} at ${OPP.name} (${OPP.style}) · ${OPP.format.toLowerCase()}`)+
  `<section class="l-panel flush" aria-label="Lineup">
    <div class="lbar"><label for="strat">Strategy</label><select id="strat">${Object.entries(STRATS).map(([k,a])=>`<option value="${k}"${k===S.strat?" selected":""}>${a.name}</option>`).join("")}</select><span class="avg">Starters average <b>${teamOvr||"—"}</b></span><button class="btn" type="button" id="autoBtn">${ic("wand")}Auto-fill</button></div>
    <div class="l-grid slots">${cards}</div>
  </section>`;
}

/* ---------- Pokémon page ---------- */
function rng(seed){let h=2166136261;for(const c of seed)h=Math.imul(h^c.charCodeAt(0),16777619);return ()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function career(m){
  const R=rng(m.id),n=Math.min(Math.max(m.age-21,1),6),rows=[],clubs=["Celadon Florals","Pewter Peaks","Cerulean Tide"];
  const start=m.age>24&&R()>.5?1:0,br=bestRole(m),best=(br||{o:50}).o;
  for(let k=0;k<n;k++){
    const yr=CLUB.season-(n-1-k),cur=k===n-1,base=cur?{active:5,backup:3,practice:1,ir:1}[m.g]:Math.round(8+R()*6)*(m.g==="practice"?0.4:1);
    const series=Math.max(1,Math.round(base)),games=Math.round(series*(2.4+R()*.5));
    const kos=Math.round(games*(best/100)*(0.7+R()*.7)),fn=Math.round(games*(0.25+R()*.35));
    const gr=Math.max(0,m.gr-(n-1-k)*Math.round(5+R()*4)),gd=GRADES.reduce((g,x)=>gr>=x[1]?x:g,GRADES[0])[0];
    rows.push({yr,club:k<start?clubs[Math.floor(R()*3)]:"Volts",role:br?br.role:"—",grade:gd,series,games,kos,fn,cur});
  }
  return rows;
}
function awards(m,rows){
  const R=rng(m.id+"aw"),best=(bestRole(m)||{o:50}).o,out=[];
  const pool=[["Series MVP","star"],["All-Kanto second team","trophy"],["Team MVP","trophy"],["Most improved","up"],["All-Kanto first team","trophy"]];
  rows.filter(r=>!r.cur).forEach(r=>{if(R()<(best-60)/45){const a=pool[Math.floor(R()*pool.length)];out.push({t:a[0],i:a[1],yr:r.yr,club:r.club})}});
  if(m.id==="gible")out.push({t:"Prospect of the week",i:"up",yr:CLUB.season,club:"Volts"});
  return out;
}
function overallIV(m,keys){const avg=keys.reduce((s,k)=>s+IV_PTS[m.iv[k]],0)/keys.length;let best="B",d=99;Object.entries(IV_PTS).forEach(([g,p])=>{if(Math.abs(p-avg)<d){d=Math.abs(p-avg);best=g}});return best}
function potential(m){const gi=GRADES.indexOf(gradeOf(m)),steps=m.age<=23?2:m.age<=27?1:0;return {g:GRADES[Math.min(GRADES.length-1,gi+steps)][0],steps}}
function viewMon(id){
  const m=BY[id];if(!m)return head("Not found","No Pokémon with that name.")+`<a class="btn" href="#roster">Back to roster</a>`;
  const {R,slot}=currentRate(m),g=gradeOf(m),n=nextGrade(m),foc=S.focus.has(m.id),sets=setsOf(m);
  const rows=career(m),tot=rows.reduce((t,x)=>({series:t.series+x.series,games:t.games+x.games,kos:t.kos+x.kos,fn:t.fn+x.fn}),{series:0,games:0,kos:0,fn:0});
  const aw=awards(m,rows),pot=potential(m);
  const kpg=(k,gm)=>gm?(k/gm).toFixed(2):"—";
  const backTo=S.from&&S.from!==location.hash?S.from:"#roster",backName=(ROOMS.flatMap(r=>r.tabs).find(t=>t[0]===backTo)||[0,"Back"])[1];
  const inv=[...new Set(sets.flatMap(invested))],ivKeys=inv.length?STATS.map(s=>s[0]).filter(k=>inv.includes(k)):STATS.map(s=>s[0]);
  const ov=overallIV(m,ivKeys),strong=ivKeys.filter(k=>m.iv[k]==="A").map(k=>STAT_LBL[k]),weakS=ivKeys.filter(k=>"DF".includes(m.iv[k])).map(k=>STAT_LBL[k]);
  const ivLine=strong.length?`Strong in ${strong.join(", ")}`:weakS.length?`Weak in ${weakS.join(", ")}`:"Even spread";
  const ivPop=`<strong>IVs</strong>${STATS.map(([k,l])=>prow(l+(ivKeys.includes(k)?"":" (not used)"),gchip(m.iv[k]))).join("")}<span>${inv.length?"Only stats its sets invest in count. Each set's rating adds the average: A +2, B 0, C −2, D −4, F −6.":"No Smogon set, so no stats are invested yet."}</span>`;
  const roleRows=rolesOf(m).map(r=>bestFor(m,[r])).filter(Boolean).sort((a,c)=>c.o-a.o);
  const rolesBlock=roleRows.length?`<div class="l-table-wrap"><table class="l-table roles"><colgroup><col style="width:34%"><col style="width:16%"><col style="width:28%"><col style="width:22%"></colgroup>
    <thead><tr><th scope="col">Role</th><th scope="col">Best tier</th><th scope="col">Set</th><th scope="col" class="num">OVR</th></tr></thead>
    <tbody>${roleRows.map(x=>{const cur=R&&slot>-1&&x.role===R.role;return `<tr class="${cur?"cur":""}"><td>${x.role}${cur?' <span class="sr">(starting slot)</span>':""}</td><td><span class="tierb">${x.tier}</span></td><td title="${esc(x.set.name)}">${esc(x.set.name)}</td><td class="num">${badge(x,{num:true})}</td></tr>`}).join("")}</tbody></table></div>`
    :`<div class="l-empty"><b>No Smogon set</b><span>${m.n} has no competitive set in any tier, so it can't fill a lineup slot yet.</span></div>`;
  let msi=S.monSet[m.id];if(msi===undefined)msi=R?R.si:0;
  const set=sets[msi],pct=g[2];
  const mvBlock=set?`<div class="slot-set"><label for="monset">Set</label><select id="monset" data-mon="${m.id}">${sets.map((s,i)=>`<option value="${i}"${i===msi?" selected":""}>${s.tier} · ${esc(s.name)}</option>`).join("")}</select><p class="fills">This set: ${set.roles.length?set.roles.join(", "):"no slot role"}</p></div>
    <ul class="moves" aria-label="Moves">${set.moves.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
    <dl class="l-kv"><dt>Item</dt><dd>${esc(set.item)}</dd><dt>Ability</dt><dd>${esc(set.ability)}</dd><dt>Nature</dt><dd>${esc(set.nature)}</dd>
      <dt>EVs at ${g[0]}</dt><dd>${STATS.filter(s=>(set.evs[s[0]]||0)>0).map(([k,l])=>`${Math.round(set.evs[k]*pct/100)} ${l}`).join(" · ")} <span class="muted">(${pct}% of ${STATS.filter(s=>(set.evs[s[0]]||0)>0).map(([k])=>set.evs[k]).join("/")})</span></dd></dl>`
    :`<div class="l-empty"><b>No Smogon set</b><span>Nothing to show until a set covers ${m.n}.</span></div>`;
  const facts=[R?(slot>-1?`Starts as ${R.role} in ${STRATS[S.strat].name}`:"Best role shown"):"No set yet",`Age ${m.age}`,`${money(m.sal)} · ${m.yrs} ${m.yrs===1?"yr":"yrs"} left`];
  const potPop=`<strong>Scouts' view</strong><span>${pot.steps?`Could reach about grade ${pot.g} if growth keeps pace.`:"At or near peak; growth will be slow from here."}</span>${prow("Stage",stage(m.age))}`;
  return `<a class="back" href="${backTo}">${ic("back")}${backName}</a>
  <header class="mh">${sprN(m.n,"xl")}
    <div class="l-stack tight"><h1 tabindex="-1">${m.n}</h1>
      <div class="l-row even">${types(m)}${badge(R)}${injTag(m)}</div>
      <p class="muted">${facts.join(" · ")}</p></div>
  </header>
  <div class="l-cols">
    <div class="l-stack loose">
      <section class="l-panel ${roleRows.length?"flush ":""}l-section" aria-labelledby="h-role"><h2 id="h-role">Roles</h2>${rolesBlock}</section>
      <section class="l-panel l-section" aria-labelledby="h-mv"><h2 id="h-mv">Moveset</h2>${mvBlock}</section>
    </div>
    <section class="l-panel l-section" aria-labelledby="h-gr"><h2 id="h-gr">Development</h2>
      <div class="ladder" role="list" aria-label="Grade ladder">${GRADES.map(x=>`<span role="listitem" class="step${x===g?" cur":""}">${gchip(x[0],x===g?' aria-current="true"':"")}<small>${x===g?"Now":""}</small></span>`).join("")}</div>
      <div class="l-stack tight">
        <div class="grow-top"><span class="cap">Growth</span><b>${m.gr}<small> /100</small></b></div>
        <div class="track" role="img" aria-label="Growth ${m.gr} of 100${n?", next grade at "+n[1]:""}"><i style="width:${m.gr}%"></i>${n?`<b style="left:${n[1]}%"></b>`:""}</div>
        <div class="grow-foot"><span>Grade ${g[0]} · ${g[2]}% of EVs · ${sgn(EV_ADJ[g[0]])} to ratings</span><span>${n?`${n[0]} at ${n[1]}`:"Top grade"}</span></div>
      </div>
      <dl class="l-kv">
        <dt id="pf-l">Practice focus</dt><dd class="l-row"><button type="button" class="switch" role="switch" aria-checked="${foc}" aria-labelledby="pf-l" data-focus="${m.id}"></button>${info("About practice focus",`<strong>Practice focus</strong><span>Extra practice reps for this Pokémon this week: about +4 growth. Others on the practice squad grow a little slower.</span>`)}</dd>
        <dt>IVs</dt><dd class="l-row">${gchip(ov)}<span>${ivLine}</span>${info("IV details",ivPop)}</dd>
        <dt>Stage</dt><dd class="l-row"><span>${stage(m.age)}</span>${info("Potential",potPop)}</dd>
      </dl>
    </section>
  </div>
  <section class="l-panel flush l-section" aria-labelledby="h-hist"><h2 id="h-hist">History</h2>
    <div class="l-table-wrap"><table class="l-table history"><colgroup><col style="width:9%"><col style="width:17%"><col style="width:17%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:11%"></colgroup>
    <thead><tr><th scope="col">Season</th><th scope="col">Club</th><th scope="col">Role</th><th scope="col">Grade</th><th scope="col" class="num">Series</th><th scope="col" class="num">Games</th><th scope="col" class="num">KOs</th><th scope="col" class="num">Fainted</th><th scope="col" class="num">KO/G</th></tr></thead>
    <tbody>${rows.map(x=>`<tr class="${x.cur?"cur":""}"><td>${x.yr}${x.cur?' <span class="sr">(current season)</span>':""}</td><td>${x.club}</td><td>${x.role}</td><td>${gchip(x.grade)}</td><td class="num">${x.series}</td><td class="num">${x.games}</td><td class="num">${x.kos}</td><td class="num">${x.fn}</td><td class="num">${kpg(x.kos,x.games)}</td></tr>`).join("")}
    <tr class="tot"><td>Career</td><td>${rows.length} ${rows.length===1?"season":"seasons"}</td><td></td><td></td><td class="num">${tot.series}</td><td class="num">${tot.games}</td><td class="num">${tot.kos}</td><td class="num">${tot.fn}</td><td class="num">${kpg(tot.kos,tot.games)}</td></tr></tbody></table></div>
  </section>
  <section class="l-panel l-section" aria-labelledby="h-aw"><h2 id="h-aw">Awards</h2>
    ${aw.length?`<ul class="l-grid awards">${aw.map(a=>`<li class="award"><span class="chip c-honour" aria-hidden="true">${ic(a.i)}</span><div><b>${a.t}</b><span>${a.yr} · ${a.club}</span></div></li>`).join("")}</ul>`:`<p class="muted">No awards yet.</p>`}
  </section>`;
}

/* ---------- rooms, nav, router ---------- */
const ROOMS=[
  {k:"team",label:"Team",icon:"home",tabs:[["#week","This week"],["#roster","Roster"],["#lineup","Lineup"]]},
  {k:"moves",label:"Moves",icon:"swap",tabs:[["#trades","Trades"],["#freeagents","Free agents"],["#offers","Offers"]]},
  {k:"draft",label:"Draft",icon:"scout",tabs:[["#scouting","Scouting"],["#draft","Draft"]]},
  {k:"league",label:"League",icon:"trophy",tabs:[["#standings","Standings"],["#playoffs","Playoffs"],["#schedule","Schedule"],["#history","History"]]}
];
const TABBAR=[["week","#week","week","This week"],["roster","#roster","roster","Roster"],["lineup","#lineup","lineup","Lineup"],["moves","#trades","swap","Moves"],["league","#standings","trophy","League"]];
function routeOf(h){
  if(h.startsWith("#mon-"))return {room:"team",tab:"#roster",bar:"roster"};
  if(h==="#battle")return {room:"team",tab:"#week",bar:"week"};
  const r=ROOMS.find(x=>x.tabs.some(t=>t[0]===h));
  if(!r)return {room:"team",tab:null,bar:null};
  return {room:r.k,tab:h,bar:r.k==="team"?h.slice(1):r.k==="moves"?"moves":"league"};
}
const flagCnt=()=>`<span class="cnt${S.flag?"":" off"}" aria-label="${S.flag?"1 slot to check":""}">1</span>`;
function subnavHtml(room,tab){
  const r=ROOMS.find(x=>x.k===room);
  const link=t=>`<a href="${t[0]}"${t[0]===tab?' aria-current="page"':""}>${t[1]}${t[0]==="#lineup"?flagCnt():""}</a>`;
  let alt="";
  if(room==="league"||room==="draft"){const o=ROOMS.find(x=>x.k===(room==="league"?"draft":"league"));alt=`<span class="alt"><span class="sep" aria-hidden="true"></span>${o.tabs.map(link).join("")}</span>`}
  return `<nav class="l-tabs subnav" aria-label="${r.label}">${r.tabs.map(link).join("")}${alt}</nav>`;
}
function navHtml(room){
  document.getElementById("sidenav").innerHTML=ROOMS.map(r=>`<a href="${S.roomTab[r.k]||r.tabs[0][0]}" data-room="${r.k}"${r.k===room?' aria-current="page"':""}>${ic(r.icon)}${r.label}${r.k==="team"?flagCnt():""}</a>`).join("");
}
function tabbarHtml(bar){
  document.getElementById("tabbar").innerHTML=TABBAR.map(([k,h,i,l])=>`<a href="${k==="moves"||k==="league"?(S.roomTab[k]||h):h}"${k===bar?' aria-current="page"':""}>${ic(i)}${l}</a>`).join("");
}
function comingSoon(h){
  const t=(ROOMS.flatMap(r=>r.tabs).find(x=>x[0]===h)||[h,h==="#battle"?"Battle":"Not found"])[1];
  return head(t,"Coming soon")+`<div class="l-empty"><b>${esc(t)} isn't in this prototype yet.</b><span>It will live here, in the same place, when it is built.</span><a class="btn" href="#week">Back to This week</a></div>`;
}
const view=document.getElementById("view"),subnav=document.getElementById("subnav");
function render(focusTitle){
  const h=location.hash||"#week",rt=routeOf(h);let html,after=null;
  if(rt.tab)S.roomTab[rt.room]=rt.room==="team"?rt.tab:h;
  if(rt.room==="draft")S.roomTab.league=h;
  try{
    if(h.startsWith("#mon-"))html=viewMon(h.slice(5));
    else if(h==="#roster")html=viewRoster();
    else if(h==="#lineup")html=viewLineup();
    else if(h==="#week")html=viewWeek();
    else{const ex=window.EXTRA_ROUTES&&window.EXTRA_ROUTES[h];
      if(typeof ex==="function"){html=ex();if(typeof ex.after==="function")after=ex.after}else html=comingSoon(h)}
  }catch(err){console.error(err);html=comingSoon(h)}
  subnav.innerHTML=subnavHtml(rt.room,rt.tab);navHtml(rt.room);tabbarHtml(rt.bar);
  view.innerHTML=html;
  hideFloat();
  if(after){try{after(view)}catch(err){console.error(err)}}
  if(focusTitle){
    if(h==="#lineup"&&S.hl!==null){const c=document.getElementById("slot-"+S.hl);if(c){c.scrollIntoView({block:"center"});const b=c.querySelector("#keepBtn")||c.querySelector("[data-chg]");if(b)b.focus({preventScroll:true})}}
    else{window.scrollTo(0,0);const t=view.querySelector("h1");if(t)t.focus({preventScroll:true})}
  }
  S.hl=null;
}
function rerender(sel){const y=scrollY;render(false);window.scrollTo(0,y);if(sel){const e=view.querySelector(sel);if(e)e.focus({preventScroll:true})}}

/* ---------- dialog (shared): openDialog(html,{returnFocus: element|selector, onClose}) ---------- */
const dlg=document.getElementById("dlg");let dlgReturn=null,dlgOnClose=null;
function openDialog(html,o){
  o=o||{};hideFloat();closeChooser(false);dlg.innerHTML=html;dlgReturn=o.returnFocus||document.activeElement;dlgOnClose=o.onClose||null;
  dlg.setAttribute("aria-labelledby",o.labelledby||"dlg-title");dlg.showModal();
  const f=dlg.querySelector("[autofocus]")||dlg.querySelector("button,a[href]");if(f)f.focus();
}
function closeDialog(){if(dlg.open)dlg.close()}
dlg.addEventListener("click",e=>{if(e.target.closest("[data-close]")||e.target===dlg)dlg.close()});
dlg.addEventListener("close",()=>{const cb=dlgOnClose,r=dlgReturn;dlgOnClose=null;dlgReturn=null;if(cb)cb();
  const el=typeof r==="string"?document.querySelector(r):r;if(el&&document.contains(el))el.focus()});

window.addEventListener("hashchange",()=>{closeChooser(false);closeDialog();render(true)});
function toggleFocus(id){S.focus.has(id)?S.focus.delete(id):S.focus.add(id)}
function setStarter(i,id){
  const L=lineup(),prev=L[i].id,j=slotOf(id);
  L[i]=mkSlot(id,i);
  if(j>-1&&j!==i){L[j]=prev&&bestFor(BY[prev],slotRoles(j))?mkSlot(prev,j):{id:null,si:null};
    if(!L[j].id){const b=backups(j)[0];if(b)L[j]={id:b.m.id,si:b.si}}}
  if(S.strat==="bulky"&&(i===FLAG_SLOT||j===FLAG_SLOT))S.flag=false;
  S.prepared=true;
}
document.addEventListener("click",e=>{
  const a=e.target.closest("a[href^='#']");
  if(a){ if(a.dataset.hl!==undefined){S.hl=+a.dataset.hl;if(S.strat!=="bulky"&&a.dataset.hl==String(FLAG_SLOT))S.strat="bulky"} if(a.dataset.lens)S.lens=a.dataset.lens;
    if(a.getAttribute("href").startsWith("#mon-"))S.from=location.hash||"#week";
    if(a.getAttribute("href")===location.hash){e.preventDefault();closeDialog();render(true)} return; }
  const b=e.target.closest("button");if(!b)return;
  if(b.getAttribute("aria-disabled")==="true")return;
  if(b.id==="playBtn"){openDialog(resultDialog(),{returnFocus:"#playBtn",onClose:()=>{if(!S.played){S.played=true;rerender()}}});return}
  if(b.dataset.focus){toggleFocus(b.dataset.focus);rerender("[data-focus]");return}
  if(b.dataset.setlens){S.lens=b.dataset.setlens;rerender(`[data-setlens="${S.lens}"]`);return}
  if(b.id==="keepBtn"){S.flag=false;S.prepared=true;rerender(`[data-chg="${FLAG_SLOT}"]`);return}
  if(b.id==="autoBtn"){S.lu[S.strat]=autoFill(S.strat);if(S.strat==="bulky")S.flag=false;S.prepared=true;rerender("#autoBtn");return}
  if(b.dataset.swap){const [i,id]=b.dataset.swap.split(":");setStarter(+i,id);rerender(`[data-chg="${i}"]`);return}
  if(b.dataset.chg!==undefined){openChooser(+b.dataset.chg,b);return}
});
document.addEventListener("keydown",e=>{
  const t=e.target.closest&&e.target.closest('[role="tab"][data-setlens]');
  if(t&&(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key==="Home"||e.key==="End")){
    const tabs=[...t.parentNode.querySelectorAll('[role="tab"]')],i=tabs.indexOf(t);
    const n=e.key==="Home"?0:e.key==="End"?tabs.length-1:(i+(e.key==="ArrowRight"?1:-1)+tabs.length)%tabs.length;
    e.preventDefault();S.lens=tabs[n].dataset.setlens;rerender(`[data-setlens="${S.lens}"]`);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="strat"){S.strat=t.value;S.prepared=true;rerender("#strat");return}
  if(t.dataset.slotset!==undefined){const i=+t.dataset.slotset;lineup()[i].si=+t.value;if(S.strat==="bulky"&&i===FLAG_SLOT)S.flag=false;S.prepared=true;rerender(`#set-${i}`);return}
  if(t.id==="monset"){S.monSet[t.dataset.mon]=+t.value;rerender("#monset")}
});

/* ---------- chooser: eligible Pokémon only ---------- */
const ch=document.getElementById("chooser"),scrim=document.getElementById("scrim");let chFrom=null,chSlot=null;
function openChooser(i,anchor){
  const roles=slotRoles(i),L=lineup(),curId=L[i].id;chSlot=i;chFrom=anchor;hideFloat();
  const list=MONS.map(m=>({m,b:bestFor(m,roles)})).filter(x=>x.b).sort((a,c)=>(available(c.m)-available(a.m))||(c.b.o-a.b.o));
  ch.innerHTML=`<div class="ch-h"><div><b id="ch-title">${roles.join(" or ")}</b><small>${list.length} eligible on your roster</small></div><button class="x" type="button" id="chX" aria-label="Close">${ic("x")}</button></div>
  ${list.length?`<ul role="list">${list.map(({m,b})=>{const dis=!available(m),j=slotOf(m.id);return `<li><button type="button" data-pick="${m.id}"${dis?' aria-disabled="true"':""}${m.id===curId?' aria-current="true"':""}>${ico(m)}<span><span class="nm">${m.n}</span><span class="where">${dis?m.inj.txt:j>-1?`Starts as ${slotRoles(j)[0]}`:"Not starting"} · ${b.tier} ${esc(b.set.name)}</span></span>${badge(b,{plain:true})}</button></li>`}).join("")}</ul>`
  :`<div class="l-empty">${emptyText(roles).replace(/<\/?b>/g,"")}</div>`}`;
  ch.hidden=false;scrim.hidden=false;
  const rc=anchor.getBoundingClientRect(),W=ch.offsetWidth,H=ch.offsetHeight;
  let left=Math.min(Math.max(8,rc.right-W),innerWidth-W-8),top=rc.bottom+6;if(top+H>innerHeight-8)top=Math.max(8,rc.top-H-6);
  ch.style.left=left+"px";ch.style.top=top+"px";
  (ch.querySelector('[aria-current="true"]')||ch.querySelector("[data-pick]:not([aria-disabled])")||ch.querySelector("#chX")).focus();
}
function closeChooser(restore){if(ch.hidden)return;ch.hidden=true;scrim.hidden=true;if(restore!==false&&chFrom&&document.contains(chFrom))chFrom.focus();chFrom=null}
scrim.addEventListener("click",()=>closeChooser());
ch.addEventListener("click",e=>{
  if(e.target.closest("#chX")){closeChooser();return}
  const b=e.target.closest("[data-pick]");if(!b||b.getAttribute("aria-disabled")==="true")return;
  const i=chSlot;setStarter(i,b.dataset.pick);closeChooser(false);rerender(`[data-chg="${i}"]`);
});
ch.addEventListener("keydown",e=>{
  const items=[...ch.querySelectorAll("[data-pick]")],i=items.indexOf(document.activeElement);
  if(e.key==="ArrowDown"&&items.length){e.preventDefault();(items[i+1]||items[0]).focus()}
  else if(e.key==="ArrowUp"&&items.length){e.preventDefault();(items[i-1]||items[items.length-1]).focus()}
  else if(e.key==="Tab"){const f=[ch.querySelector("#chX"),...items];const j=f.indexOf(document.activeElement);e.preventDefault();f[(j+(e.shiftKey?-1:1)+f.length)%f.length].focus()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(!ch.hidden){e.preventDefault();closeChooser()}hideFloat()}});

/* ---------- peeks (one floating layer) ---------- */
const fl=document.getElementById("float");let flOwner=null;
function showFloat(p){if(!ch.hidden)return;if(dlg.open&&!dlg.contains(p))return;
  const pop=p.querySelector(":scope>.pop");if(!pop)return;
  fl.innerHTML=pop.innerHTML;fl.hidden=false;flOwner=p;p.setAttribute("aria-describedby","float");
  if(dlg.open&&fl.parentNode!==dlg)dlg.appendChild(fl);else if(!dlg.open&&fl.parentNode!==document.body)document.body.appendChild(fl);
  const rc=p.getBoundingClientRect(),fw=fl.offsetWidth,fh=fl.offsetHeight;
  let left=Math.min(Math.max(8,rc.left),innerWidth-fw-8),top=rc.bottom+8;if(top+fh>innerHeight-8)top=Math.max(8,rc.top-fh-8);
  fl.style.left=left+"px";fl.style.top=top+"px";
}
function hideFloat(){if(flOwner)flOwner.removeAttribute("aria-describedby");fl.hidden=true;flOwner=null}
document.addEventListener("pointerover",e=>{const p=e.target.closest(".peek");if(p&&p!==flOwner)showFloat(p);else if(!p&&flOwner&&e.pointerType==="mouse")hideFloat()});
document.addEventListener("focusin",e=>{const p=e.target.closest(".peek");if(p)showFloat(p);else if(flOwner)hideFloat()});
document.addEventListener("pointerdown",e=>{const p=e.target.closest(".peek");if(p)showFloat(p);else hideFloat()});
window.addEventListener("scroll",hideFloat,{passive:true});
document.addEventListener("scroll",hideFloat,{passive:true,capture:true});

/* ---------- extra screens are inlined here; they share this scope ---------- */
/*@@EXTRA_JS@@*/

render(false);
})();
</script>
